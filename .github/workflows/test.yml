name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (fails below 80%)
        id: coverage
        shell: bash
        # The captured output is written outside coverage/ because Vitest's
        # coverage provider clears that whole directory at startup, which
        # would delete the file out from under `tee` before we can read it.
        # NO_COLOR keeps the captured text plain — GitHub Actions runners
        # force ANSI colors even on piped/non-TTY stdout, which otherwise
        # splits table text like "% Coverage report from v8" into color-coded
        # fragments and breaks the awk match below.
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          npm run test:coverage | tee /tmp/vitest-full-output.txt
        continue-on-error: true

      - name: Comment coverage summary on PR (changed files)
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Build all-files coverage table comment
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            echo "<!-- all-files-coverage-comment -->"
            echo "<details>"
            echo "<summary>All files coverage (v8)</summary>"
            echo ""
            echo '```text'
            awk '/% Coverage report from v8/,0' /tmp/vitest-full-output.txt
            echo '```'
            echo "</details>"
          } > /tmp/all-files-comment.md

      - name: Find existing all-files coverage comment
        if: always() && github.event_name == 'pull_request'
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- all-files-coverage-comment -->"

      - name: Comment all-files coverage table on PR
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/all-files-comment.md
          edit-mode: replace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Fail the job if tests or coverage thresholds failed
        if: steps.coverage.outcome == 'failure'
        run: exit 1
